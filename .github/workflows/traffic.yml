name: Update Repository Traffic

on:
  workflow_dispatch:

  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: write

jobs:
  update-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update traffic analytics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_traffic.py

      - name: Commit analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/traffic.json docs/traffic.svg

          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore: update repository traffic analytics"
            git push
          fi